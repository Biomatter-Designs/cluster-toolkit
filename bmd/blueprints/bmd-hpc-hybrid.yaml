# Biomatter hybrid Slurm: cloud nodes for the on-prem cluster bmd-hpc.
#
# Based on community/examples/hpc-slurm6-hybrid.yaml (Cluster Toolkit v1.109.0).
# The controller and login nodes are on-prem (bmd-ansible). This blueprint
# only creates the cloud side: the nodesets and partitions (instance
# templates), and the files the on-prem controller needs (cloud.conf,
# resume/suspend scripts). No firewall rules: the project's own apply.
#
# Differences from upstream that shape this file:
# - No network is created: the nodes use the existing subnet of the project.
# - No image is built here: the nodes boot our images, families bmd-hpc-cpu
#   and bmd-hpc-gpu, built by bmd-packer (hpc/) with our Slurm version, ids
#   and key. Upstream's image groups are removed.
# See bmd/README.md.
#
# Values come from an untracked deployment file that Ansible on the operator
# generates from bmd-ansible group_vars/hpc (role hpc_cloud_deploy), which
# also sets the Terraform state bucket (terraform_backend_defaults):
#   gcluster create bmd/blueprints/bmd-hpc-hybrid.yaml -d bmd-hpc-hybrid-deployment.yaml
#
# Vars left without a value are set ONLY by that deployment file, from
# bmd-ansible (their single source). gcluster refuses to run while one is
# missing ("deployment variable ... was not set"), so a run without the file
# fails instead of using a stale copy. Do not add defaults for them here.

ai_assisted: true

blueprint_name: bmd-hpc-hybrid

vars:
  # ---- GCP (bmd-ansible group_vars/hpc) ----
  project_id:
  region:
  zone:
  deployment_name: bmd-hpc-hybrid

  # The existing network and subnet the nodes live in. The subnet's range
  # must not overlap anything on-prem (10.16.x, 192.168.x).
  network_name:
  subnetwork_name:

  # Service account the nodes run as. Its rights come from the custom role
  # granted to it; the blueprint grants nothing.
  compute_service_account_email:

  # Service account of the on-prem controller (resume.py/suspend.py, token
  # from Vault). No controller VM exists in hybrid mode, but the controller
  # module grants this account (and the nodes') read on the config bucket.
  # Unset, it falls back to the project's default compute account.
  controller_service_account_email:

  # Existing bucket for the cluster's config files (config.yaml and the
  # like), created by hand. The nodes read it at boot, the controller's
  # resume/suspend scripts too. The controller module grants both accounts
  # read on it, so the deployer has Storage Admin on this bucket.
  slurm_bucket_name:

  # ---- Regions (bmd-ansible hpc_cloud_regions) ----
  # One set per region, short name euw4, euw1, ... Every nodeset takes its
  # region's values. region/zone above are the main region (euw4): its
  # nodesets, the config bucket and the controller module use them; other
  # regions have their own region_<short>/zone_<short>.
  # Data bucket: read-only data for jobs, bmd-hpc-data-<region>, created
  # outside (bmd-infra-terraform). Passed to the nodes as metadata
  # hpc-data-bucket; the image mounts it on /mnt/shared/bucket_data
  # (bmd-ansible role hpc_cloud_storage_install). See bmd/docs/storage.md.
  data_bucket_euw4:
  region_euw1:
  zone_euw1:
  data_bucket_euw1:

  # Start of every cloud node name: <node_name_prefix>-<nodeset name>-<n>,
  # e.g. gcp-l4g24r-0. slurm-gcp calls it the cluster name, but it is not
  # Slurm's ClusterName: in hybrid mode our own slurm.conf sets that, and
  # accounting uses it. Changing it renames every template: deploy only
  # when no cloud node is running.
  node_name_prefix:

  # ---- On-prem cluster (bmd-ansible group_vars/hpc) ----
  slurm_version:
  slurm_uid:
  slurm_gid:
  onprem_ctld_host:
  onprem_ctld_addr:

  # Controller paths of our deb install (not the /slurm/dev/... layout of the
  # upstream guide). resume.py and suspend.py run on the controller and call
  # scontrol from slurm_bin_dir.
  onprem_slurm_bin_dir: /usr/bin
  onprem_slurm_log_dir: /var/log/slurm
  # Where the generated scripts and cloud*.conf go on the controller.
  # bmd-ansible unpacks config.tgz there; cloud.conf points at this path.
  onprem_cloud_dir: /etc/slurm/cloud

  # Where gcluster writes the hybrid files on the operator (config.tgz).
  output_dir: /opt/cluster-toolkit-deployments/$(vars.deployment_name)/hybrid-files

  # ---- Images (bmd-packer hpc/) ----
  # Families. A node boots the newest image of its family at the moment it
  # is created, without a deploy: see the nodesets' instance_properties.
  # Boot disks are the images' sizes.
  cpu_image_family: bmd-hpc-cpu
  gpu_image_family: bmd-hpc-gpu
  cpu_image:
    family: $(vars.cpu_image_family)
    project: $(vars.project_id)
  gpu_image:
    family: $(vars.gpu_image_family)
    project: $(vars.project_id)
  # Zones besides vars.zone where GPU nodes may start (same region).
  gpu_extra_zones: [europe-west4-a, europe-west4-c]
  cpu_disk_size_gb: 64
  gpu_disk_size_gb: 128
  # Hyperdisk Balanced boot disks (gcp-euw4-16c64rspot). IOPS at the most a
  # disk of cpu_disk_size_gb allows (500 per GiB: 64 GiB -> 32000); a larger
  # value needs a larger disk. Baseline is 3000 IOPS, 140 MiB/s; above it is
  # paid. GCP refuses values beyond the disk's or the machine's limits when
  # it creates the disk (error in resume.log at node start, not at deploy).
  hyperdisk_iops: 32000
  hyperdisk_throughput: 1000

  # Network tag on every cloud node, for firewall rules. The blueprint
  # creates none for now: traffic to and between the nodes is allowed by
  # the project's own rules. A rule added later targets this tag.
  node_tag: bmd-hpc-node

  # Node metadata. Project-wide SSH keys would create local users with sudo
  # on the nodes (Google's guest agent); our images have the ansible account
  # and our users instead. OS Login is turned off with enable_oslogin.
  node_metadata:
    block-project-ssh-keys: "TRUE"
  # The same plus the region's data bucket; each nodeset takes its region's.
  node_metadata_euw4: $(merge(vars.node_metadata, {"hpc-data-bucket" = vars.data_bucket_euw4}))
  node_metadata_euw1: $(merge(vars.node_metadata, {"hpc-data-bucket" = vars.data_bucket_euw1}))

deployment_groups:
- group: cluster
  modules:
  # One module per region: the same VPC, the subnet of that region (all
  # named subnetwork_name). "network" is the main region (euw4); the
  # controller module uses it too.
  - id: network
    source: modules/network/pre-existing-vpc
    settings:
      network_name: $(vars.network_name)
      subnetwork_name: $(vars.subnetwork_name)

  - id: network_euw1
    source: modules/network/pre-existing-vpc
    settings:
      network_name: $(vars.network_name)
      subnetwork_name: $(vars.subnetwork_name)
      region: $(vars.region_euw1)

  # ---- Partitions ----
  # Each cloud partition is two modules:
  #   nodeset:   a group of identical VMs (one instance template): machine
  #              type, image, disk, account, how many at most
  #   partition: the Slurm partition (queue) on top of it
  # Names follow the cluster-wide scheme (bmd-ansible,
  # roles/slurmctld_install/README.md "Partition names"), with the region:
  #   CPU gcp-<region>-<cpus>c<ram GB>r[spot], GPU gcp-<region>-<model>g<gpu GB>r[spot]
  # Region short names: euw4 = europe-west4, euw1 = europe-west1. One
  # partition never spans regions; users pick several with -p a,b.
  # Node names are <node_name_prefix>-<nodeset name>-<n>. The module strips
  # hyphens from nodeset names, so a nodeset is the machine part with the
  # region appended: partition gcp-euw4-l4g24r, nodeset l4g24reuw4, nodes
  # gcp-l4g24reuw4-0, -1, ... (region first would run into the digits:
  # euw48c32rspot).
  #
  # Hyperthreading on (threads_per_core: 2) everywhere, as on our on-prem
  # nodes: Slurm gets all vCPUs and hands out whole cores (CR_Core_Memory),
  # so two jobs never share a core. GCP bills the machine type's vCPUs
  # either way. Names count vCPUs, as Slurm shows them (n2-standard-8 = 8).
  #
  # Testing sizes. exclusive: false keeps a node for several jobs until it
  # has been idle for 300 s, instead of deleting it after every job.
  # is_default: false keeps the on-prem partition the default.
  #
  # Node features (node_conf), the same scheme as on-prem (bmd-ansible,
  # roles/slurmctld_install/README.md "Node features"): GPU model short name,
  # gpumem_<GB>, sm_<compute capability>, spot / ondemand.
  #
  # Wiring is written out (no use: between these modules), so the expanded
  # blueprint lists exactly these partitions and nothing generated.

  # ---- europe-west4 (euw4), the main region ----
  # gcp-euw4-8c32rspot: CPU, n2-standard-8 (8 vCPUs = 4 cores, 32 GB),
  # spot, at most 2 nodes
  - id: euw4_8c32rspot_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      name: 8c32rspoteuw4
      machine_type: n2-standard-8
      # 2, not left out: the module's default is 1 (hyperthreading off).
      advanced_machine_features:
        threads_per_core: 2
      node_conf:
        Features: spot
      enable_spot_vm: true
      # Preempted VMs are deleted, not left stopped (with their disk). Must
      # be set: unset, GCP fills in STOP and every plan replaces the template.
      spot_instance_config:
        termination_action: DELETE
      node_count_dynamic_max: 2
      enable_placement: false
      instance_image: $(vars.cpu_image)
      instance_image_custom: true
      disk_size_gb: $(vars.cpu_disk_size_gb)
      disk_type: pd-balanced
      # The newest image of the family at every node start (no deploy after
      # an image build). The module writes the family's newest image NAME
      # into the instance template at deploy time; resume.py sends these
      # properties with each VM request, and GCP resolves a family URL when
      # it creates the VM. Replaces the template's disk list: keep size and
      # type equal to the two settings above. See bmd/docs/partitions.md.
      instance_properties:
        disks:
        - boot: true
          autoDelete: true
          initializeParams:
            sourceImage: projects/$(vars.project_id)/global/images/family/$(vars.cpu_image_family)
            diskSizeGb: $(vars.cpu_disk_size_gb)
            diskType: pd-balanced
      service_account_email: $(vars.compute_service_account_email)
      enable_oslogin: false
      metadata: $(vars.node_metadata_euw4)
      tags: [$(vars.node_tag)]

  - id: euw4_8c32rspot_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    settings:
      partition_name: gcp-euw4-8c32rspot
      nodeset: [$(euw4_8c32rspot_nodeset.nodeset)]
      exclusive: false
      is_default: false

  # gcp-euw4-16c64rspot: CPU, n4-standard-16 (16 vCPUs, 64 GB), spot, at most 2
  # nodes. Hyperdisk Balanced boot disk (N4 takes only Hyperdisk) with
  # provisioned IOPS and throughput (hyperdisk_iops, hyperdisk_throughput).
  - id: euw4_16c64rspot_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      name: 16c64rspoteuw4
      machine_type: n4-standard-16
      # 2, not left out: the module's default is 1 (hyperthreading off).
      advanced_machine_features:
        threads_per_core: 2
      node_conf:
        Features: spot
      enable_spot_vm: true
      spot_instance_config:
        termination_action: DELETE
      node_count_dynamic_max: 2
      enable_placement: false
      instance_image: $(vars.cpu_image)
      instance_image_custom: true
      disk_size_gb: $(vars.cpu_disk_size_gb)
      disk_type: hyperdisk-balanced
      disk_provisioned_iops: $(vars.hyperdisk_iops)
      disk_provisioned_throughput: $(vars.hyperdisk_throughput)
      # Newest image of the family at every node start, as for gcp-euw4-8c32rspot.
      # The IOPS and throughput again: this disk list replaces the template's.
      instance_properties:
        disks:
        - boot: true
          autoDelete: true
          initializeParams:
            sourceImage: projects/$(vars.project_id)/global/images/family/$(vars.cpu_image_family)
            diskSizeGb: $(vars.cpu_disk_size_gb)
            diskType: hyperdisk-balanced
            provisionedIops: $(vars.hyperdisk_iops)
            provisionedThroughput: $(vars.hyperdisk_throughput)
      service_account_email: $(vars.compute_service_account_email)
      enable_oslogin: false
      metadata: $(vars.node_metadata_euw4)
      tags: [$(vars.node_tag)]

  - id: euw4_16c64rspot_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    settings:
      partition_name: gcp-euw4-16c64rspot
      nodeset: [$(euw4_16c64rspot_nodeset.nodeset)]
      exclusive: false
      is_default: false

  # gcp-euw4-l4g24r: GPU, g2-standard-8 (1x L4 24 GB, 4 cores, 32 GB), on-demand,
  # at most 10 nodes
  - id: euw4_l4g24r_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      name: l4g24reuw4
      machine_type: g2-standard-8
      # L4s run out in one zone (ZONE_RESOURCE_POOL_EXHAUSTED): allow the
      # region's other zones too. resume.py then asks for the region and GCP
      # picks a zone with capacity. The subnet is regional, so the network
      # and the VPN are the same in every zone.
      zones: $(vars.gpu_extra_zones)
      # 2, not left out: the module's default is 1 (hyperthreading off).
      advanced_machine_features:
        threads_per_core: 2
      # Typed GRES: the type must match cloud_gres.conf (GCP's accelerator
      # name). Short model name as a feature, so users write -C l4 --gres=gpu:1.
      node_conf:
        Gres: gpu:nvidia-l4:1
        Features: l4,gpumem_24,sm_89,ondemand
      node_count_dynamic_max: 10
      enable_placement: false
      instance_image: $(vars.gpu_image)
      instance_image_custom: true
      disk_size_gb: $(vars.gpu_disk_size_gb)
      disk_type: pd-balanced
      # Newest image of the family at every node start, as for gcp-euw4-8c32rspot.
      instance_properties:
        disks:
        - boot: true
          autoDelete: true
          initializeParams:
            sourceImage: projects/$(vars.project_id)/global/images/family/$(vars.gpu_image_family)
            diskSizeGb: $(vars.gpu_disk_size_gb)
            diskType: pd-balanced
      service_account_email: $(vars.compute_service_account_email)
      enable_oslogin: false
      metadata: $(vars.node_metadata_euw4)
      tags: [$(vars.node_tag)]

  - id: euw4_l4g24r_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    settings:
      partition_name: gcp-euw4-l4g24r
      nodeset: [$(euw4_l4g24r_nodeset.nodeset)]
      exclusive: false
      is_default: false

  # gcp-euw4-l4g24rspot: as gcp-euw4-l4g24r, but spot (deleted when GCP
  # takes it back), at most 10 nodes. Same zones.
  - id: euw4_l4g24rspot_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      name: l4g24rspoteuw4
      machine_type: g2-standard-8
      zones: $(vars.gpu_extra_zones)
      # 2, not left out: the module's default is 1 (hyperthreading off).
      advanced_machine_features:
        threads_per_core: 2
      node_conf:
        Gres: gpu:nvidia-l4:1
        Features: l4,gpumem_24,sm_89,spot
      enable_spot_vm: true
      spot_instance_config:
        termination_action: DELETE
      node_count_dynamic_max: 10
      enable_placement: false
      instance_image: $(vars.gpu_image)
      instance_image_custom: true
      disk_size_gb: $(vars.gpu_disk_size_gb)
      disk_type: pd-balanced
      # Newest image of the family at every node start, as for gcp-euw4-8c32rspot.
      instance_properties:
        disks:
        - boot: true
          autoDelete: true
          initializeParams:
            sourceImage: projects/$(vars.project_id)/global/images/family/$(vars.gpu_image_family)
            diskSizeGb: $(vars.gpu_disk_size_gb)
            diskType: pd-balanced
      service_account_email: $(vars.compute_service_account_email)
      enable_oslogin: false
      metadata: $(vars.node_metadata_euw4)
      tags: [$(vars.node_tag)]

  - id: euw4_l4g24rspot_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    settings:
      partition_name: gcp-euw4-l4g24rspot
      nodeset: [$(euw4_l4g24rspot_nodeset.nodeset)]
      exclusive: false
      is_default: false

  # ---- europe-west1 (euw1) ----
  # gcp-euw1-8c32rspot: as gcp-euw4-8c32rspot, in europe-west1. Second
  # region for the storage pilot (bucket replication); at most 2 nodes.
  - id: euw1_8c32rspot_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network_euw1]
    settings:
      name: 8c32rspoteuw1
      region: $(vars.region_euw1)
      zone: $(vars.zone_euw1)
      machine_type: n2-standard-8
      advanced_machine_features:
        threads_per_core: 2
      node_conf:
        Features: spot
      enable_spot_vm: true
      spot_instance_config:
        termination_action: DELETE
      node_count_dynamic_max: 2
      enable_placement: false
      instance_image: $(vars.cpu_image)
      instance_image_custom: true
      disk_size_gb: $(vars.cpu_disk_size_gb)
      disk_type: pd-balanced
      # Newest image of the family at every node start, as for gcp-euw4-8c32rspot.
      instance_properties:
        disks:
        - boot: true
          autoDelete: true
          initializeParams:
            sourceImage: projects/$(vars.project_id)/global/images/family/$(vars.cpu_image_family)
            diskSizeGb: $(vars.cpu_disk_size_gb)
            diskType: pd-balanced
      service_account_email: $(vars.compute_service_account_email)
      enable_oslogin: false
      metadata: $(vars.node_metadata_euw1)
      tags: [$(vars.node_tag)]

  - id: euw1_8c32rspot_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    settings:
      partition_name: gcp-euw1-8c32rspot
      nodeset: [$(euw1_8c32rspot_nodeset.nodeset)]
      exclusive: false
      is_default: false

  # ---- The on-prem controller's side ----
  # Creates no VM in hybrid mode: writes the config files for the bucket
  # and the hybrid files (cloud.conf, resume.py, suspend.py) for our
  # controller.
  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use: [network]
    settings:
      # One line per partition above. Each partition module returns a
      # one-item list, hence [0].
      partitions:
      - $(euw4_8c32rspot_partition.partitions[0])
      - $(euw4_16c64rspot_partition.partitions[0])
      - $(euw4_l4g24r_partition.partitions[0])
      - $(euw4_l4g24rspot_partition.partitions[0])
      - $(euw1_8c32rspot_partition.partitions[0])
      nodeset:
      - $(euw4_8c32rspot_partition.nodeset[0])
      - $(euw4_16c64rspot_partition.nodeset[0])
      - $(euw4_l4g24r_partition.nodeset[0])
      - $(euw4_l4g24rspot_partition.nodeset[0])
      - $(euw1_8c32rspot_partition.nodeset[0])
      # Not used: dynamic nodesets (VMs started outside slurm-gcp) and TPUs.
      nodeset_dyn: []
      nodeset_tpu: []

      enable_hybrid: true
      slurm_cluster_name: $(vars.node_name_prefix)
      enable_slurm_auth: true
      # No slurm_key_mount: the key is in our images (bmd-packer). Our patch
      # in setup_network_storage.py keeps nodes from waiting for its export.
      # No NFS from the controller either (/home, /opt/apps): our on-prem
      # controller exports nothing; users and tools are in the images.
      enable_default_mounts: false
      create_bucket: false
      bucket_name: $(vars.slurm_bucket_name)
      output_dir: $(vars.output_dir)
      install_dir: $(vars.onprem_cloud_dir)
      hybrid_conf:
        slurm_control_host: $(vars.onprem_ctld_host)
        slurm_control_addr: $(vars.onprem_ctld_addr)
        slurm_uid: $(vars.slurm_uid)
        slurm_gid: $(vars.slurm_gid)
        slurm_log_dir: $(vars.onprem_slurm_log_dir)
        slurm_bin_dir: $(vars.onprem_slurm_bin_dir)
        slurm_version: $(vars.slurm_version)
        # The controller's account (hpc-slurm-controller-node). In hybrid
        # mode the module grants it read on the config bucket from here;
        # unset, it grants that to the project's default compute account.
        service_account_email: $(vars.controller_service_account_email)
        # Access token of hpc-slurm-controller-node (start and delete
        # nodes), refreshed every 15 min by bmd-ansible's
        # slurm_gcp_token_install. Needs our util.py patch: upstream reads
        # only key files here. See bmd/docs/upstream-changes.md.
        google_app_cred_path: /etc/slurm/cloud/gcp-sa.json
